<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>最新消息｜毛毛澡堂（網站提案示範）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="news.html">
<header id="site-head"></header>

<main>
  <div class="page-head tiles">
    <div class="wrap">
      <div class="plate"><h1>最新消息</h1></div>
      <br><p>公休、活動、服務調整，都會先公告在這裡。</p>
    </div>
  </div>
  <section class="sec" style="padding-top:48px">
    <div class="wrap">
      <ul class="news-list" id="news" style="margin-top:0"></ul>
    </div>
  </section>
</main>

<footer id="site-foot"></footer>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/guard.js"></script>
<script>
(function () {
  var data = MM.Store.load();
  var list = MM.sortedNews(data);
  var closures = (data.closures || []).filter(function (c) { return c.date >= MM.taipeiNow().date; })
    .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var html = closures.map(function (c) {
    return '<li><a href="visit.html"><time datetime="' + c.date + '">' + c.date.replace(/-/g, "/") + '</time><span class="t">臨時公休' + (c.reason ? "：" + MM.esc(c.reason) : "") + '</span><span class="tag off">公休</span></a></li>';
  }).join("");
  html += list.map(function (n) {
    return '<li><a href="news-post.html?id=' + encodeURIComponent(n.id) + '"><time datetime="' + n.date + '">' + n.date.replace(/-/g, "/") + '</time><span class="t">' + MM.esc(n.title) + '</span><span class="tag' + (n.pinned ? " pin" : "") + '">' + (n.pinned ? "置頂" : MM.esc(n.tag)) + "</span></a></li>";
  }).join("");
  document.getElementById("news").innerHTML = html || '<li class="empty">目前沒有新消息。</li>';
})();
</script>
</body>
</html>
